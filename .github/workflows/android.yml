name: EcoResiduos - Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar SDK Android
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar aplicación y pruebas
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Guardar APK y resultados
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecoresiduos-build
          path: |
            app/build/outputs/apk/debug/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
