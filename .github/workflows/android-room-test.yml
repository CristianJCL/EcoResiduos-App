name: EcoResiduos - Room en emulador

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar SDK de compilación
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          "$SDKMANAGER" "platforms;android-36"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ejecutar Room DAO en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew connectedDebugAndroidTest
            adb shell am start -n com.cristian.ecoresiduos/.MainActivity
            sleep 5
            adb exec-out screencap -p > ecoresiduos-emulador.png

      - name: Guardar resultados y captura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecoresiduos-room-emulador
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
            ecoresiduos-emulador.png
          if-no-files-found: ignore
